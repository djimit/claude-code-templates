name: Dependency regressions
on:
  pull_request:
    paths: ['package*.json', 'scripts/**', 'cli-tool/package*.json', 'cli-tool/scripts/**', 'docu/**', '.github/workflows/dependency-regressions.yml']
  push:
    branches: [main]
    paths: ['package*.json', 'scripts/**', 'cli-tool/package*.json', 'cli-tool/scripts/**', 'docu/**', '.github/workflows/dependency-regressions.yml']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        graph: ['.', cli-tool, docu]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ matrix.graph }}
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npx --yes --package=npm@12.2.1 npm ci --ignore-scripts
      - run: node --test scripts/*.test.cjs
      - if: matrix.graph == 'docu'
        run: npm run typecheck
      - if: matrix.graph == 'docu'
        run: npm run build
